 <!DOCTYPE html>
 <html lang="en">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Anwar Sadath | AI Creator & Coder</title>
     <style>
         * {
             margin: 0;
             padding: 0;
             box-sizing: border-box;
             font-family: 'Poppins', system-ui, -apple-system, sans-serif;
         }
 
         body {
             min-height: 100vh;
             display: flex;
             justify-content: center;
             align-items: center;
             background: #0f0c20;
             color: #ffffff;
             position: relative;
             overflow-x: hidden;
             padding: 20px;
         }
 
         /* Background Image with Blur */
         .bg-image {
             position: fixed;
             top: 0;
             left: 0;
             width: 100%;
             height: 100%;
             background: url('photo.jpg') no-repeat center center/cover;
             filter: blur(12px) brightness(0.4);
             transform: scale(1.1);
             z-index: -2;
         }
 
         /* Glowing Light Orbs in Background */
         .glow-1, .glow-2 {
             position: fixed;
             border-radius: 50%;
             filter: blur(80px);
             z-index: -1;
             opacity: 0.6;
         }
         .glow-1 {
             width: 250px;
             height: 250px;
             background: #ff007f;
             top: 10%;
             left: 10%;
         }
         .glow-2 {
             width: 300px;
             height: 300px;
             background: #00d2ff;
             bottom: 10%;
             right: 10%;
         }
 
         /* Glassmorphism Card Container */
         .glass-card {
             background: rgba(255, 255, 255, 0.07);
             backdrop-filter: blur(16px);
             -webkit-backdrop-filter: blur(16px);
             border: 1px solid rgba(255, 255, 255, 0.18);
             border-radius: 24px;
             padding: 40px 25px;
             max-width: 500px;
             width: 100%;
             text-align: center;
             box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
         }
 
         /* Small Profile Photo with Glass Effect Border */
         .profile-img {
             width: 110px;
             height: 110px;
             border-radius: 50%;
             object-fit: cover;
             border: 3px solid rgba(255, 255, 255, 0.3);
             box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
             margin-bottom: 20px;
         }
 
         /* Shimmer / Shuttering Text Effect for Name */
         .shimmer-text {
             font-size: 2.2rem;
             font-weight: 800;
             letter-spacing: 2px;
             text-transform: uppercase;
             background: linear-gradient(90deg, #ffffff 0%, #00d2ff 50%, #ff007f 100%);
             background-size: 200% auto;
             color: transparent;
             -webkit-background-clip: text;
             background-clip: text;
             animation: shine 3s linear infinite;
             margin-bottom: 5px;
         }
 
         @keyframes shine {
             to { background-position: 200% center; }
         }
 
         .welcome-badge {
             display: inline-block;
             background: rgba(0, 210, 255, 0.15);
             border: 1px solid rgba(0, 210, 255, 0.4);
             color: #00d2ff;
             padding: 6px 16px;
             border-radius: 20px;
             font-size: 0.85rem;
             font-weight: 600;
             letter-spacing: 1.5px;
             margin-bottom: 15px;
         }
 
         .subtitle {
             font-size: 1rem;
             color: #e0e0e0;
             font-weight: 500;
             margin-bottom: 25px;
         }
 
         /* Note / Bio Box */
         .bio-box {
             background: rgba(0, 0, 0, 0.25);
             border-left: 4px solid #ff007f;
             border-radius: 12px;
             padding: 18px;
             text-align: left;
             font-size: 0.92rem;
             line-height: 1.6;
             color: #d1d5db;
         }
 
         .bio-box span {
             color: #00d2ff;
             font-weight: 600;
         }
     </style>
 </head>
 <body>
 
     <!-- Background Photo & Glow Effects -->
     <div class="bg-image"></div>
     <div class="glow-1"></div>
     <div class="glow-2"></div>
 
     <!-- Main Glass Card -->
     <div class="glass-card">
         <!-- Small Profile Photo -->
         <img src="photo.jpg" alt="Anwar Sadath" class="profile-img">
 
         <div>
             <span class="welcome-badge">WELCOME TO MY WORLD</span>
         </div>
 
         <!-- Premium Name with Shimmer Effect -->
         <h1 class="shimmer-text">ANWAR SADATH</h1>
         <p class="subtitle">🚀 AI Creator | Coder | Tech Enthusiast</p>
 
         <!-- Big Note / About Me -->
         <div class="bio-box">
             Hello & Welcome! I am <span>Anwar Sadath</span>. I build innovative solutions using modern technology, AI tools, and coding. Passionate about creating futuristic digital experiences right from mobile devices to complex web projects.
         </div>
     </div>
 
 </body>
 </html>
